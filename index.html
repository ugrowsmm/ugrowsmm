    <style>.ug-loader{display:grid;place-items:center;gap:16px}.ug-loader.full{position:fixed;inset:0;background:#ffffff}.ug-loader-mark{width:56px;height:56px;border-radius:14px;background:url(/icons/logo.svg?v=3) center/cover no-repeat;animation:p 1.4s ease-in-out infinite}.ug-loader-bar{width:120px;height:3px;border-radius:9px;background:#eef2f6;overflow:hidden}.ug-loader-bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#f97316,#38bdf8);animation:b 1.1s ease-in-out infinite}@keyframes p{50%{transform:scale(.92)}}@keyframes b{from{transform:translateX(-100%)}to{transform:translateX(280%)}}</style>
